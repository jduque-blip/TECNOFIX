{% load formato %}{# Etiqueta de color con el estado de una orden. Recibe: orden #}
<span class="rounded-full px-3 py-1 text-xs font-bold text-white whitespace-nowrap {% if orden.cierre_visible %}bg-rose-600{% elif orden.estado == 'RECIBIDO' %}bg-sky-500{% elif orden.estado == 'DIAGNOSTICO' %}bg-amber-500{% elif orden.estado == 'REPARACION' %}bg-violet-500{% elif orden.estado == 'LISTO' %}bg-emerald-500{% else %}bg-slate-500{% endif %}">{{ orden|estado_para:user }}</span>
{% if orden.atrasada %}<span class="rounded-full px-3 py-1 text-xs font-bold text-white bg-rose-500 whitespace-nowrap">Atrasada</span>{% endif %}
